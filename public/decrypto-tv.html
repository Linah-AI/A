<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ديكربتو — شاشة التلفزيون</title>
<link rel="stylesheet" href="css/pop.css" />
<style>
/* لعبة "ديكربتو" — نكهة تجسّس داكنة: بنفسجي + وردي صارخ + أصفر */
:root{ --dc-purple:#7B1FD4; --dc-pink:#FF5FCF; --dc-yellow:#FAEB92; --dc-dark:#1A0B2E; }
body{ background-color:#1A0B2E;
  background-image:radial-gradient(rgba(255,95,207,.10) 2px,transparent 2.5px); background-size:30px 30px; color:var(--cream) }
.tv{ min-height:100vh; display:flex; flex-direction:column; padding:1.3rem 1.6rem 1.6rem; gap:1.1rem }
.tv-top{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:.55rem; font-family:var(--bubble); font-size:1.4rem; color:var(--cream) }
.brand .m{ width:2.2rem;height:2.2rem;background:var(--dc-purple);border:var(--bw) solid var(--ink);border-radius:8px;
  display:grid;place-items:center;color:var(--cream);box-shadow:var(--shadow-sm);transform:rotate(-5deg);font-family:var(--bubble) }
.show-name{ font-family:var(--display); font-weight:800; font-size:clamp(1.8rem,4.5vw,3rem); color:var(--dc-pink);
  -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink), 0 0 22px rgba(255,95,207,.5) }

/* عدّاد الرموز */
.bar{ display:grid; grid-template-columns:1fr auto 1fr; gap:1rem; align-items:center }
.team{ border:var(--bw-lg) solid var(--ink); border-radius:14px; padding:.7rem 1.1rem; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; gap:.7rem }
.team.green{ background:#2d1a4d; color:var(--cream) }
.team.red{ background:#3d1535; color:var(--cream); flex-direction:row-reverse }
.team .nm{ font-family:var(--bubble); font-size:1.3rem }
.tokens{ display:flex; gap:.4rem }
.tok{ width:1.7rem;height:1.7rem;border-radius:50%; border:3px solid var(--ink); box-shadow:var(--shadow-sm) }
.tok.white{ background:#fff } .tok.black{ background:#000; box-shadow:inset 0 0 0 3px var(--dc-pink), var(--shadow-sm) }
.tok.empty{ background:transparent; border-style:dashed; opacity:.5 }

/* جدول التلميحات */
.stage{ flex:1; display:flex; flex-direction:column; gap:1rem; max-width:940px; margin:0 auto; width:100% }
.clue-card{ background:#241141; border:var(--bw-lg) solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:1.4rem 1.6rem }
.clue-card .hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:.5rem }
.clue-card .hd h3{ font-family:var(--bubble); font-size:1.5rem; color:var(--dc-yellow) }
.ct{ width:100%; border-collapse:separate; border-spacing:0 .55rem }
.ct th{ font-family:var(--heavy); font-weight:800; color:var(--dc-pink); font-size:.9rem; padding:.3rem .8rem; text-align:center }
.ct td{ background:#321a55; padding:.7rem 1rem; font-weight:800; text-align:center; border-block:3px solid var(--ink) }
.ct td:first-child{ border-radius:0 12px 12px 0; border-right:3px solid var(--ink) }
.ct td:last-child{ border-radius:12px 0 0 12px; border-left:3px solid var(--ink) }
.ct .num{ background:var(--dc-purple); color:var(--cream); font-family:var(--bubble); font-size:1.3rem }
.ct .dash{ color:#6a5288 }
.ct .wait td{ background:#1f0f38; color:var(--dc-pink); border-style:dashed }
.foot-note{ text-align:center }
@media(max-width:760px){ .bar{ grid-template-columns:1fr } .ct th:nth-child(n+4),.ct td:nth-child(n+4){ display:none } }
</style>
</head>
<body>
<main class="tv">
  <div class="tv-top">
    <div class="brand"><span class="m">A</span> أركيدو</div>
    <div class="show-name">ديكربتو</div>
    <span class="sticker" style="background:var(--dc-purple);color:var(--cream)">الجولة 4 · دور الأخضر</span>
  </div>

  <!-- الرموز -->
  <div class="bar">
    <div class="team green">
      <span class="nm">الأخضر</span>
      <span class="tokens"><span class="tok white"></span><span class="tok empty"></span><span class="tok black"></span><span class="tok empty"></span></span>
    </div>
    <div class="sticker" style="background:#000;color:var(--dc-yellow)">⬜ اعتراض · ⬛ سوء فهم</div>
    <div class="team red">
      <span class="nm">الأحمر</span>
      <span class="tokens"><span class="tok empty"></span><span class="tok empty"></span><span class="tok white"></span><span class="tok empty"></span></span>
    </div>
  </div>

  <!-- جدول التلميحات -->
  <div class="stage">
    <div class="clue-card">
      <div class="hd">
        <h3>📜 جدول التلميحات (الأخضر)</h3>
        <span class="sticker" style="background:#321a55;color:#c7b8d8;border-color:var(--ink)">الكلمات السرية لا تظهر هنا أبداً</span>
      </div>
      <table class="ct">
        <thead><tr><th>الجولة</th><th>كلمة 1</th><th>كلمة 2</th><th>كلمة 3</th><th>كلمة 4</th></tr></thead>
        <tbody>
          <tr><td class="num">1</td><td class="dash">—</td><td>أزرق</td><td class="dash">—</td><td>سريع</td></tr>
          <tr><td class="num">2</td><td>مَلِك</td><td class="dash">—</td><td>ماء</td><td class="dash">—</td></tr>
          <tr><td class="num">3</td><td class="dash">—</td><td>سماء</td><td class="dash">—</td><td>سيارة</td></tr>
          <tr class="wait"><td class="num" style="background:var(--dc-pink)">4</td><td colspan="4">⏳ بانتظار تلميحات الرمز الجديد…</td></tr>
        </tbody>
      </table>
    </div>
    <p class="foot-note sticker" style="background:#241141;color:#c7b8d8;border-color:var(--ink)">🔓 يحلّل الخصم الأنماط من الجولات السابقة لمحاولة اختراق الشفرة</p>
  </div>
</main>
</body>
</html>
