<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أركيدو — قريباً</title>
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/pop.css" />
<style>
body{ min-height:100vh; display:grid; place-items:center; padding:2rem 1.2rem;
  background-color:var(--paper); background-image:radial-gradient(rgba(36,30,26,.07) 2px,transparent 2.5px); background-size:26px 26px }
.wrap{ width:min(560px,100%); text-align:center }
/* الشعار */
.brand-mark{ width:130px; height:130px; margin:0 auto 1.2rem; animation:bob 3s ease-in-out infinite }
@keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-10px) rotate(2deg)} }
.brand-name{ font-family:var(--bubble); font-weight:800; font-size:3rem; color:var(--coral);
  -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:4px 4px 0 var(--ink); letter-spacing:2px; line-height:1 }
.brand-sub{ font-family:var(--heavy); font-weight:800; color:var(--teal); letter-spacing:3px; margin-top:.3rem }

/* البطاقة */
.card{ background:var(--cream); border:var(--bw-lg) solid var(--ink); border-radius:var(--radius);
  box-shadow:var(--shadow-lg); padding:2.4rem 1.8rem; margin-top:1.8rem; position:relative; overflow:hidden }
.card::before{ content:""; position:absolute; inset:0; z-index:0;
  background:repeating-linear-gradient(45deg, transparent 0 18px, rgba(227,169,46,.10) 18px 36px) }
.cone{ width:120px; height:120px; margin:0 auto 1rem; position:relative; z-index:1 }
.title{ font-family:var(--bubble); font-weight:800; font-size:1.9rem; color:var(--ink); position:relative; z-index:1 }
.msg{ font-weight:700; font-size:1.1rem; color:var(--ink-soft); margin-top:.6rem; line-height:1.7; position:relative; z-index:1 }
.game-badge{ display:inline-block; margin-top:1rem; position:relative; z-index:1 }
.back{ display:inline-flex; align-items:center; gap:.5rem; margin-top:1.6rem; position:relative; z-index:1 }
.dots{ display:flex; gap:.5rem; justify-content:center; margin-top:1.2rem; position:relative; z-index:1 }
.dots span{ width:.8rem;height:.8rem;border-radius:50%; border:2px solid var(--ink); animation:blink 1.4s infinite }
.dots span:nth-child(1){ background:#59B292 } .dots span:nth-child(2){ background:#FFC94D; animation-delay:.2s }
.dots span:nth-child(3){ background:#FA6781; animation-delay:.4s } .dots span:nth-child(4){ background:#075B5E; animation-delay:.6s }
@keyframes blink{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.8)} }
</style>
</head>
<body>
<!-- مكتبة SVG: شعار أركيدو + مخروط التحذير -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="arcado-mark" viewBox="0 0 100 100">
    <circle cx="38" cy="38" r="32" fill="#59B292" stroke="#241E1A" stroke-width="4"/>
    <circle cx="62" cy="38" r="32" fill="#FFC94D" stroke="#241E1A" stroke-width="4"/>
    <circle cx="38" cy="62" r="32" fill="#FA6781" stroke="#241E1A" stroke-width="4"/>
    <circle cx="62" cy="62" r="32" fill="#075B5E" stroke="#241E1A" stroke-width="4"/>
    <polygon points="50,36 53,46 64,46 55,53 58,63 50,57 42,63 45,53 36,46 47,46"
      fill="#fff" stroke="#241E1A" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="cone" viewBox="0 0 100 100">
    <!-- ظل -->
    <ellipse cx="50" cy="90" rx="34" ry="6" fill="rgba(0,0,0,.15)"/>
    <!-- قاعدة المخروط -->
    <rect x="20" y="78" width="60" height="12" rx="4" fill="#E3A92E" stroke="#241E1A" stroke-width="3"/>
    <!-- جسم المخروط -->
    <path d="M38 30 L62 30 L74 80 L26 80 Z" fill="#E2583F" stroke="#241E1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- شريط عاكس -->
    <path d="M34 50 L66 50 L69 62 L31 62 Z" fill="#FBF4E2" stroke="#241E1A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- رأس المخروط -->
    <path d="M42 18 L58 18 L62 30 L38 30 Z" fill="#E2583F" stroke="#241E1A" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="50" cy="14" r="5" fill="#E2583F" stroke="#241E1A" stroke-width="3"/>
    <!-- أداة: مفتاح ربط مائل -->
    <g transform="rotate(30 86 70)">
      <rect x="82" y="55" width="7" height="26" rx="3" fill="#9aa0a6" stroke="#241E1A" stroke-width="2.5"/>
      <circle cx="85.5" cy="53" r="7" fill="none" stroke="#241E1A" stroke-width="2.5"/>
    </g>
    <!-- أداة: مطرقة على الأرض -->
    <g transform="rotate(-18 14 80)">
      <rect x="6" y="78" width="22" height="5" rx="2" fill="#8a5a2b" stroke="#241E1A" stroke-width="2"/>
      <rect x="24" y="73" width="9" height="14" rx="2" fill="#9aa0a6" stroke="#241E1A" stroke-width="2"/>
    </g>
  </symbol>
</defs></svg>

<div class="wrap">
  <div class="brand-mark"><svg viewBox="0 0 100 100" style="overflow:visible"><use href="#arcado-mark"/></svg></div>
  <div class="brand-name">أركيدو</div>
  <div class="brand-sub">ARCADO</div>

  <div class="card">
    <div class="cone"><svg viewBox="0 0 100 100" style="overflow:visible"><use href="#cone"/></svg></div>
    <div class="title" id="title">على نار هادئة 🔥</div>
    <p class="msg">لعبة <b id="gameName">قريباً</b> قيد التجهيز، ونحرص أن تخرج لكم بأبهى حُلّة.<br>ترقّبوها — تستاهلون الأفضل! 🎮</p>
    <div class="game-badge sticker mustard" id="badge">قريباً</div>
    <div class="dots"><span></span><span></span><span></span><span></span></div>
    <a class="back pop-btn coral" href="index.html">← رجوع للرئيسية</a>
  </div>
</div>

<script>
// اسم اللعبة من الرابط: soon.html?g=حروف
const g = new URLSearchParams(location.search).get('g');
if (g) {
  document.getElementById('gameName').textContent = '«' + g + '»';
  document.getElementById('badge').textContent = g + ' — قريباً';
  document.getElementById('title').textContent = 'على نار هادئة 🔥';
  document.title = 'أركيدو — ' + g + ' قريباً';
}
</script>
</body>
</html>
