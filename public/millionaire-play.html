<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>من سيربح الجائزة — جوال اللاعب</title>
<link rel="stylesheet" href="css/pop.css" />
<style>
/* جوال اللاعب — شاشة واحدة: زر الـ Buzz العملاق بنكهة الفريق */
body{ background-color:#F3E7C8; min-height:100vh; display:grid; place-items:center; padding:1.2rem }
.phone{ width:min(420px,100%); min-height:88vh; background:var(--cream); border:var(--bw-lg) solid var(--ink);
  border-radius:30px; box-shadow:var(--shadow-lg); overflow:hidden; display:flex; flex-direction:column }
.ph-head{ background:var(--teal); color:var(--cream); padding:1.2rem 1.4rem; border-bottom:var(--bw) solid var(--ink);
  display:flex; align-items:center; justify-content:space-between }
.ph-head .team{ font-family:var(--bubble); font-size:1.5rem }
.ph-head .bal{ background:var(--cream); color:var(--ink); border:var(--bw) solid var(--ink); border-radius:99px;
  padding:.25rem .9rem; font-weight:900; box-shadow:var(--shadow-sm) }
.ph-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4rem; padding:1.6rem; text-align:center }
.qinfo{ font-weight:800; color:var(--ink-soft) }
.buzz{ width:230px;height:230px;border-radius:50%; background:var(--teal); color:var(--cream);
  font-family:var(--bubble); font-size:2.6rem; border:var(--bw-lg) solid var(--ink);
  box-shadow:0 12px 0 var(--ink), 0 18px 30px rgba(0,0,0,.3); transition:transform .08s, box-shadow .08s; position:relative }
.buzz::after{ content:""; position:absolute; inset:14px; border-radius:50%; border:3px dashed rgba(255,255,255,.5) }
.buzz:active{ transform:translateY(10px); box-shadow:0 2px 0 var(--ink), 0 6px 14px rgba(0,0,0,.3) }
.hint{ font-weight:700; font-size:.9rem; color:var(--ink-soft); max-width:26ch }
.flash{ position:fixed; inset:0; pointer-events:none; opacity:0; z-index:20; background:radial-gradient(circle,var(--teal),transparent 70%) }
</style>
</head>
<body>
<div class="phone">
  <div class="ph-head">
    <span class="team">الفريق الأخضر</span>
    <span class="bal">42 ريال</span>
  </div>
  <div class="ph-body">
    <div class="sticker mustard">السؤال 4 من 7</div>
    <p class="qinfo">اضغطوا بسرعة لتجاوبوا قبل الخصم!</p>
    <button class="buzz" onclick="doBuzz()">BUZZ</button>
    <p class="hint">الأسرع ضغطاً يكسب حق الإجابة — لو أخطأ، السؤال ينتقل لكم.</p>
  </div>
</div>
<div class="flash" id="flash"></div>
<script>
function doBuzz(){ const f=document.getElementById('flash');
  f.animate([{opacity:0},{opacity:.6},{opacity:0}],{duration:600,easing:'ease-out'});
  if(navigator.vibrate) navigator.vibrate(60); }
</script>
</body>
</html>
