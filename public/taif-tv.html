<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>طيف — شاشة التلفزيون</title>
<link rel="stylesheet" href="css/pop.css" />
<style>
/* لعبة "طيف" — نكهة ناعمة: وردي + أخضر فاتح + مقياس قوسي */
:root{ --tf-pink:#E58BA6; --tf-green:#9FCB7E; --tf-bg:#F7E9EC; }
body{ background-color:#F7E9EC;
  background-image:radial-gradient(rgba(180,90,120,.10) 2px,transparent 2.5px); background-size:28px 28px }
.tv{ min-height:100vh; display:flex; flex-direction:column; padding:1.3rem 1.6rem 1.8rem; gap:1.1rem }
.tv-top{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:.55rem; font-family:var(--bubble); font-size:1.4rem }
.brand .m{ width:2.2rem;height:2.2rem;background:var(--tf-pink);border:var(--bw) solid var(--ink);border-radius:8px;
  display:grid;place-items:center;color:var(--cream);box-shadow:var(--shadow-sm);transform:rotate(-5deg);font-family:var(--bubble) }
.show-name{ font-family:var(--display); font-size:clamp(1.8rem,4.5vw,3rem); color:var(--tf-pink);
  -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink) }
.bar{ display:grid; grid-template-columns:1fr auto 1fr; gap:1rem; align-items:center }
.team{ border:var(--bw-lg) solid var(--ink); border-radius:14px; padding:.55rem 1.1rem; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; gap:.7rem; font-family:var(--bubble) }
.team.green{ background:var(--tf-green); color:var(--ink) }
.team.red{ background:var(--tf-pink); color:var(--cream); flex-direction:row-reverse }
.team .nm{ font-size:1.2rem } .team .pts{ font-size:2rem; background:var(--cream); color:var(--ink);
  border:var(--bw) solid var(--ink); border-radius:10px; padding:0 .6rem; box-shadow:var(--shadow-sm) }

.stage{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1.4rem; max-width:820px; margin:0 auto; width:100% }
/* بطاقة التلميح */
.clue{ background:var(--cream); border:var(--bw-lg) solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-lg);
  padding:1.4rem 2rem; text-align:center; position:relative; min-width:min(560px,90%) }
.clue .lbl{ position:absolute; top:-15px; right:50%; transform:translateX(50%) }
.clue .txt{ font-family:var(--bubble); font-size:2.2rem; color:var(--ink) }

/* المقياس القوسي */
.gauge-wrap{ width:min(640px,100%); position:relative }
.gauge{ width:100%; aspect-ratio:2/1; position:relative; overflow:hidden }
.gauge .arc{ position:absolute; inset:0 0 auto; width:100%; aspect-ratio:1/1; border-radius:50%;
  background:conic-gradient(from -90deg, var(--tf-green) 0deg, #EBD96A 60deg, #EFA85C 120deg, var(--tf-pink) 180deg, transparent 180deg);
  border:var(--bw-lg) solid var(--ink) }
.gauge .hub-mask{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:55%; aspect-ratio:1/1;
  background:var(--tf-bg); border-radius:50%; border:var(--bw-lg) solid var(--ink); z-index:2 }
.gauge .needle{ position:absolute; left:50%; bottom:2px; width:8px; height:46%; background:var(--ink); border-radius:6px;
  transform-origin:bottom center; transform:translateX(-50%) rotate(20deg); z-index:3; transition:transform .4s var(--ease,ease) }
.gauge .needle::after{ content:""; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%; background:var(--mustard); border:var(--bw) solid var(--ink) }
.poles{ display:flex; justify-content:space-between; width:min(640px,100%) }
.note{ text-align:center }
@media(max-width:760px){ .bar{ grid-template-columns:1fr } .clue .txt{ font-size:1.6rem } }
</style>
</head>
<body>
<main class="tv">
  <div class="tv-top">
    <div class="brand"><span class="m">A</span> أركيدو</div>
    <div class="show-name">طيف</div>
    <span class="sticker" style="background:var(--tf-pink);color:var(--cream)">الجولة 3</span>
  </div>

  <div class="bar">
    <div class="team green"><span class="nm">الأخضر</span><span class="pts">6</span></div>
    <div class="sticker" style="background:var(--cream);color:var(--ink)">دور الأخضر — الخصم يخمّن الاتجاه</div>
    <div class="team red"><span class="nm">الأحمر</span><span class="pts">4</span></div>
  </div>

  <div class="stage">
    <div class="clue">
      <span class="lbl sticker" style="background:var(--tf-green);color:var(--ink)">💬 تلميح الوسيط</span>
      <div class="txt">«قهوة الصباح»</div>
    </div>

    <div class="gauge-wrap">
      <div class="gauge">
        <div class="arc"></div>
        <div class="hub-mask"></div>
        <div class="needle" id="needle"></div>
      </div>
    </div>
    <div class="poles">
      <span class="sticker" style="background:var(--tf-green);color:var(--ink)">❄️ بارد جداً</span>
      <span class="sticker" style="background:var(--tf-pink);color:var(--cream)">🔥 حار جداً</span>
    </div>

    <p class="note sticker" style="background:var(--cream);color:var(--ink)">المؤشر يتحرك مباشرة أثناء نقاش الفريق · العجلة مغلقة لا تكشف الهدف</p>
  </div>
</main>

<script>
let dir=1, deg=10; const n=document.getElementById('needle');
setInterval(()=>{ deg+=dir*5; if(deg>60||deg<-60) dir*=-1; n.style.transform=`translateX(-50%) rotate(${deg}deg)`; },450);
</script>
</body>
</html>
