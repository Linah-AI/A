<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حروف — شاشة التلفزيون</title>
<link rel="stylesheet" href="css/pop.css" />
<style>
/* لعبة "حروف" — نكهة استراتيجية: أزرق ملكي + أصفر فاتح + لوحة سداسية */
:root{ --hu-blue:#2F5E96; --hu-yellow:#F2C744; }
body{ background-color:#2F5E96;
  background-image:radial-gradient(rgba(255,255,255,.10) 2px, transparent 2.5px); background-size:30px 30px; color:var(--cream) }
.tv{ min-height:100vh; display:flex; flex-direction:column; padding:1.3rem 1.6rem 1.6rem; gap:1rem }
.tv-top{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap }
.brand{ display:flex; align-items:center; gap:.55rem; font-family:var(--bubble); font-size:1.4rem; color:var(--cream) }
.brand .m{ width:2.2rem;height:2.2rem;background:var(--coral);border:var(--bw) solid var(--ink);border-radius:8px;
  display:grid;place-items:center;color:var(--cream);box-shadow:var(--shadow-sm);transform:rotate(-5deg);font-family:var(--bubble) }
.show-name{ font-family:var(--display); font-weight:800; font-size:clamp(2.2rem,5.5vw,3.6rem); color:var(--hu-yellow);
  -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink) }

/* لوحة النتيجة + الاتجاهات */
.bar{ display:grid; grid-template-columns:1fr auto 1fr; gap:1rem; align-items:center }
.team{ border:var(--bw-lg) solid var(--ink); border-radius:14px; padding:.6rem 1.1rem; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; gap:.7rem; font-family:var(--bubble) }
.team.green{ background:var(--teal); color:var(--cream) }
.team.red{ background:var(--coral); color:var(--cream); flex-direction:row-reverse }
.team .nm{ font-size:1.2rem } .team .pts{ font-size:2rem; background:var(--cream); color:var(--ink);
  border:var(--bw) solid var(--ink); border-radius:10px; padding:0 .6rem; box-shadow:var(--shadow-sm) }
.turn{ text-align:center }

/* اللوحة السداسية — خلية نحل منتظمة */
.board-wrap{ flex:1; display:flex; align-items:center; justify-content:center }
.board{ display:flex; flex-direction:column; align-items:center }
.hrow{ display:flex; margin-top:-22px }
.hrow:first-child{ margin-top:0 }
.hrow:nth-child(even){ transform:translateX(-43px) }   /* إزاحة نصف خلية لتعشيق خلية النحل */
.hcell{ position:relative; margin:0 3px;
  filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink));
  transition:transform .15s }
.hex{ width:80px;height:90px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:var(--cream); display:grid; place-items:center;
  font-family:var(--bubble); font-size:2.6rem; color:var(--ink);
  -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill }   /* حرف سميك بحدّ */
.hex.green{ background:var(--teal); color:var(--cream) }
.hex.red{ background:var(--coral); color:var(--cream) }
.hex.dead{ background:#1a1410; color:#5a5048; -webkit-text-stroke-color:#3a3028 }
.hcell.active{ transform:scale(1.12); z-index:3 }
.hcell.active .hex{ background:var(--hu-yellow) }

.legend{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap }
.lg{ display:inline-flex; align-items:center; gap:.4rem; background:rgba(0,0,0,.25); border:3px solid var(--ink);
  border-radius:99px; padding:.3rem .9rem; font-weight:800; font-size:.85rem }
.lg .sw{ width:1rem;height:1rem;border-radius:4px;border:2px solid var(--ink) }
@media(max-width:760px){ .hex{ width:56px;height:64px;font-size:1.9rem } .hrow:nth-child(even){ transform:translateX(-30px) } .bar{ grid-template-columns:1fr } }
</style>
</head>
<body>
<main class="tv">
  <div class="tv-top">
    <div class="brand"><span class="m">A</span> أركيدو</div>
    <div class="show-name">حروف</div>
    <span class="sticker mustard">الأخضر: يمين←يسار · الأحمر: أعلى←أسفل</span>
  </div>

  <div class="bar">
    <div class="team green"><span class="nm">الأخضر</span><span class="pts">7</span></div>
    <div class="turn sticker" style="background:var(--hu-yellow);color:var(--ink)">دور الأخضر — الحرف «ق»</div>
    <div class="team red"><span class="nm">الأحمر</span><span class="pts">5</span></div>
  </div>

  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="legend">
    <span class="lg"><span class="sw" style="background:var(--teal)"></span> خلية الأخضر</span>
    <span class="lg"><span class="sw" style="background:var(--coral)"></span> خلية الأحمر</span>
    <span class="lg"><span class="sw" style="background:#1a1410"></span> محترقة (عائق)</span>
  </div>
</main>

<script>
// شبكة 5×5 منتظمة تماماً = 25 خلية · نختار 25 حرفاً عشوائياً من الـ28 كل جلسة
const ALL=['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي'];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const letters=shuffle(ALL).slice(0,25);
const rows=[]; for(let i=0;i<letters.length;i+=5) rows.push(letters.slice(i,i+5));  // 5+5+5+5+5
// حالات تجريبية عشوائية للعرض (شكل فقط)
const states={}; const pool=shuffle(letters);
pool.slice(0,4).forEach(c=>states[c]='green'); pool.slice(4,8).forEach(c=>states[c]='red');
pool.slice(8,10).forEach(c=>states[c]='dead'); states[pool[10]]='active';
const board=document.getElementById('board');
rows.forEach(r=>{const row=document.createElement('div');row.className='hrow';
  r.forEach(ch=>{
    const cell=document.createElement('div'); cell.className='hcell'+(states[ch]==='active'?' active':'');
    const h=document.createElement('div'); h.className='hex'+(states[ch]&&states[ch]!=='active'?' '+states[ch]:''); h.textContent=ch;
    cell.appendChild(h); row.appendChild(cell);});
  board.appendChild(row);});
</script>
</body>
</html>
